services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: medialit
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medialit}
            POSTGRES_DB: medialit
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U medialit -d medialit"]
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data

    migrate:
        image: codelit/medialit
        restart: "no"
        command: ["node", "apps/api/dist/src/db/migrate.js"]
        environment:
            - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-postgresql://medialit:medialit@postgres:5432/medialit}
        depends_on:
            postgres:
                condition: service_healthy

    medialit:
        image: codelit/medialit
        restart: on-failure
        environment:
            - EMAIL=${EMAIL:-}
            - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-postgresql://medialit:medialit@postgres:5432/medialit}
            - CLOUD_ENDPOINT=${CLOUD_ENDPOINT:-}
            - CLOUD_ENDPOINT_PUBLIC=${CLOUD_ENDPOINT_PUBLIC:-}
            - CLOUD_REGION=${CLOUD_REGION:-}
            - CLOUD_KEY=${CLOUD_KEY:-}
            - CLOUD_SECRET=${CLOUD_SECRET:-}
            - CLOUD_BUCKET_NAME=${CLOUD_BUCKET_NAME:-}
            - CLOUD_PUBLIC_BUCKET_NAME=${CLOUD_PUBLIC_BUCKET_NAME:-}
            - PATH_PREFIX=${PATH_PREFIX:-}
            - TEMP_FILE_DIR_FOR_UPLOADS=${TEMP_FILE_DIR_FOR_UPLOADS:-/tmp/medialit}
            - PORT=8000
            - ENABLE_TRUST_PROXY=${ENABLE_TRUST_PROXY:-}
            - ACCESS_PRIVATE_BUCKET_VIA_CLOUDFRONT=${ACCESS_PRIVATE_BUCKET_VIA_CLOUDFRONT:-}
            - CDN_ENDPOINT=${CDN_ENDPOINT:-}
            - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID:-}
            - CLOUDFRONT_PRIVATE_KEY=${CLOUDFRONT_PRIVATE_KEY:-}
            - CDN_MAX_AGE=${CDN_MAX_AGE:-}
            - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
            # Deprecated fallback retained for existing deployments during the
            # OAuth-server-kit cutover. Prefer BETTER_AUTH_SECRET.
            - OAUTH_SIGNING_KEY=${OAUTH_SIGNING_KEY:-}
            - API_PUBLIC_URL=${API_PUBLIC_URL:-}
            - WEB_INTERNAL_API_SECRET=${WEB_INTERNAL_API_SECRET:-}
        expose:
            - 8000
        depends_on:
            migrate:
                condition: service_completed_successfully

    proxy:
        image: caddy
        restart: on-failure
        environment:
            - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
        ports:
            - "443:443"
        volumes:
            - "./Caddyfile:/etc/caddy/Caddyfile"
        depends_on:
            - medialit

volumes:
    postgres-data:
