version: "3"

services:
  postgres:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: medialit
      POSTGRES_PASSWORD: medialit
      POSTGRES_DB: medialit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medialit -d medialit"]
      interval: 5s
      timeout: 5s
      retries: 12

  init:
    image: codelit/medialit
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://medialit:medialit@postgres:5432/medialit
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "apps/api/src/db/migrate.ts"]

  medialit:
    image: codelit/medialit
    restart: on-failure
    environment:
      - EMAIL=${EMAIL?'Email is required to set up a user'}
      - DATABASE_URL=postgresql://medialit:medialit@postgres:5432/medialit
      - OAUTH_SIGNING_KEY=${OAUTH_SIGNING_KEY?'OAUTH_SIGNING_KEY is required'}
      - CLOUD_ENDPOINT=${CLOUD_ENDPOINT?'Cloud endpoint is required'}
      - CLOUD_REGION=${CLOUD_REGION?'Cloud region is required'}
      - CLOUD_KEY=${CLOUD_KEY?'Cloud key is required'}
      - CLOUD_SECRET=${CLOUD_SECRET?'Cloud secret is required'}
      - CLOUD_BUCKET_NAME=${CLOUD_BUCKET_NAME?'Cloud bucket name is required'}
      - PATH_PREFIX=${PATH_PREFIX?'Cloud prefix is required'}
      - TEMP_FILE_DIR_FOR_UPLOADS=${TEMP_FILE_DIR_FOR_UPLOADS?'A temporary directory for uploads transformations is required'}
      - PORT=8000
      - ENABLE_TRUST_PROXY=${ENABLE_TRUST_PROXY}
      - ACCESS_PRIVATE_BUCKET_VIA_CLOUDFRONT=${ACCESS_PRIVATE_BUCKET_VIA_CLOUDFRONT} 
      - CDN_ENDPOINT=${CDN_ENDPOINT} 
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID} 
      - CLOUDFRONT_PRIVATE_KEY=${CLOUDFRONT_PRIVATE_KEY}
      - CDN_MAX_AGE=${CDN_MAX_AGE}
    expose:
      - 8000
    depends_on:
      init:
        condition: service_completed_successfully

  proxy:
    image: caddy
    restart: on-failure
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
    ports:
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile"
    depends_on:
      - medialit 