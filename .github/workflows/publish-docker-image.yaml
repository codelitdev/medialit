name: Publish Docker image

on:
  push:
    tags:
      # Only release tags. Changesets pushes package tags like medialit@0.3.0.
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Our Kubernetes nodes run on arm64; self-hosters may use amd64.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}

      - name: Docker meta for API 
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: codelit/medialit 

      - name: Build and push API 
        id: docker_build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Image digest
        run: echo ${{ steps.docker_build_api.outputs.digest }}

      # The transcription worker (pipelines-phase-2.md, D3): the API image of
      # this release plus Whisper and its pinned model.
      - name: Docker meta for the transcription worker
        id: meta_transcribe
        uses: docker/metadata-action@v5
        with:
          images: codelit/medialit-transcribe

      - name: Build and push the transcription worker
        id: docker_build_transcribe
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/transcribe/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            API_IMAGE=codelit/medialit:${{ steps.meta_api.outputs.version }}
          tags: ${{ steps.meta_transcribe.outputs.tags }}
          cache-from: type=gha,scope=transcribe
          cache-to: type=gha,mode=max,scope=transcribe

      - name: Transcription image digest
        run: echo ${{ steps.docker_build_transcribe.outputs.digest }}

      - name: Docker meta for Web app
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: codelit/medialit-web 

      - name: Build and push Web App 
        id: docker_build_web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Image digest
        run: echo ${{ steps.docker_build_web.outputs.digest }}