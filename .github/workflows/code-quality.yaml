name: Code Quality
on:
    push:
        branches:
            - "**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
    CI: true
    DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/medialit_test
    MEDIALIT_AUTH_TEST_DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/medialit_test
    MONGO_TEST_CONNECTION_STRING: mongodb://localhost:27017/medialit_migration_test

jobs:
    lint-format-test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: medialit_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d medialit_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            mongo:
                image: mongo:7
                ports:
                    - 27017:27017
        steps:
            - name: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Configure CI Git User
              run: |
                  git config --global user.name 'GitHub Actions'
                  git config --global user.email 'hi@codelit.dev'
                  git remote set-url origin https://$GITHUB_ACTOR:$GITHUB_PAT@github.com/codelitdev/medialit
              env:
                  GITHUB_PAT: ${{ secrets.PAT }}

            - name: Checkout and pull branch
              run: git checkout "${GITHUB_REF:11}" && git pull

            - name: Install pnpm
              run: |
                  npm i pnpm@10.7.1 -g

            - name: Install dependencies
              run: pnpm install

            - name: Run lint
              run: pnpm lint

            - name: Run prettier
              run: pnpm prettier

            - name: Build dependencies
              run: |
                  pnpm -r build

            - name: Apply database migrations
              run: pnpm --filter @medialit/api db:migrate

            - name: Run test
              run: pnpm test
